name = "audiosyncrasies-spotify"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# Cron trigger - runs at 9am UTC daily (~2am Pacific; drifts to 1am during PST)
[triggers]
crons = ["0 9 * * *"]

# Environment variables (non-sensitive)
[vars]
PLAYLIST_ID = "5MpC0JxMZJ7bIJPwPFCtNv"

# Secrets (set these with `npx wrangler secret put` or via Ansible):
# - SPOTIFY_CLIENT_ID
# - SPOTIFY_CLIENT_SECRET
# - SPOTIFY_REFRESH_TOKEN
